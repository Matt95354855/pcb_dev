[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-dev"
version = "0.3.0"
description = "Hierarchical PCB design models, deterministic preflight checks, and gated KiCad workflows"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "pcb_dev contributors"}]
keywords = ["pcb", "kicad", "eda", "design-as-code"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.scripts]
pcb-dev = "pcb_dev.cli:main"

[project.urls]
Repository = "https://github.com/Matt95354855/pcb_dev"
Issues = "https://github.com/Matt95354855/pcb_dev/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pcb_dev = ["data/*.json", "web/*.html"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
